# Publication d'une version : à chaque étiquette « v1.2.3 » (le CHANGELOG.md doit avoir sa section), l'installateur MSI
# est compilé avec le moteur Etable (sous-module) et les plugins de ce dépôt, signé pour la mise à jour automatique, puis
# publié dans les Releases avec latest.json, le fichier que l'AGL installé consulte (dépôt public).
name: Publication

on:
  push:
    tags: ["v*"]
  # sur une PR ou à la main : construit l'installateur pour l'essayer, sans rien publier
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installateur Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Étiquette et version de l'application identiques
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./hameau.conf.json').version")
          if [ "$tag" != "$app" ]; then
            echo "::error::Étiquette v$tag mais hameau.conf.json en $app : changez la version avant de publier."
            exit 1
          fi

      - name: Notes de version (CHANGELOG.md)
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          node etable/scripts/notes-version.mjs CHANGELOG.md "$version" --texte > "$RUNNER_TEMP/notes.txt"
          node etable/scripts/notes-version.mjs CHANGELOG.md "$version" --release > "$RUNNER_TEMP/notes-release.md"

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Installateur MSI
        if: github.ref_type != 'tag'
        run: npm run build -- --bundles msi

      - name: Installateur MSI signé pour la mise à jour
        if: github.ref_type == 'tag'
        env:
          HAMEAU_RELEASE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build -- --bundles msi

      - name: Installateur à essayer (lancement à la main)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: hameau-msi
          path: etable/apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      - name: Publication de la version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi=$(ls etable/apps/desktop/src-tauri/target/release/bundle/msi/*.msi)
          test -f "$msi.sig" || { echo "::error::Pas de fichier .sig : la signature de mise à jour a échoué."; exit 1; }
          node scripts/latest-json.mjs "$GITHUB_REF_NAME" "$msi" "$RUNNER_TEMP/notes.txt" > "$RUNNER_TEMP/latest.json"
          gh release create "$GITHUB_REF_NAME" "$msi" "$msi.sig" "$RUNNER_TEMP/latest.json" --title "AGL $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes-release.md"
